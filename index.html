<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Everyday · To-do app</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <header><p class="eyebrow">A LITTLE PROGRESS, EVERY DAY</p><h1>Your daily list.</h1><p>Make room for what matters.</p></header>
      <section class="card" aria-label="To-do list">
        <form id="task-form">
          <label for="task-input">What's on your mind?</label>
          <div class="input-row"><input id="task-input" maxlength="200" placeholder="Add a task…" required autocomplete="off" /><button type="submit">Add task</button></div>
        </form>
        <div class="toolbar"><div class="filters" role="group" aria-label="Filter tasks"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="active" aria-pressed="false">Active</button><button type="button" data-filter="completed" aria-pressed="false">Completed</button></div><span id="count"></span></div>
        <ul id="task-list" aria-label="Tasks"></ul>
        <p id="empty">A fresh start. Add your first task above.</p>
        <footer><span id="summary" role="status" aria-live="polite"></span><button id="clear-completed" type="button">Clear completed</button></footer>
        <p id="storage-warning" role="alert" hidden></p>
      </section>
      <p class="note">One task at a time. You've got this.</p>
    </main>
  </body>
</html>
